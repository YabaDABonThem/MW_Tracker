<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miliastra Wonderland | Wish Tracker</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #161b2b;
            --panel-border: #2a314d;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;

            --legendary-color: #fbbf24;
            --elite-color: #c084fc;
            --rare-color: #60a5fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 1rem;
        }

        h1 {
            color: var(--accent-gold);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .banner-toggle {
            display: flex;
            gap: 1rem;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            border-color: var(--accent-purple);
        }

        button.active {
            background-color: var(--accent-purple);
            border-color: var(--accent-purple);
            color: white;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .currency-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 0.5rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 0.5rem 0;
        }

        .soft-pity {
            color: #f97316;
        }

        .hard-pity {
            color: #ef4444;
        }



        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .filter-toggle button {
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
        }

        .panel h2 {
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-color);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 6px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--panel-border);
        }

        th {
            color: var(--text-muted);
        }

        .rarity-legendary {
            color: var(--legendary-color);
            font-weight: bold;
        }

        .rarity-elite {
            color: var(--elite-color);
            font-weight: bold;
        }

        .rarity-rare {
            color: var(--rare-color);
        }

        .rarity-white {
            color: #ffffff;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
        }
        .modal-close:hover {
            color: var(--text-main);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .data-management {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>Miliastra Wonderland Ode Tracker</h1>
            </div>
            <div class="banner-toggle">
                <button class="active" id="btn-event" onclick="setBanner('event')">Event Odes</button>
                <button id="btn-standard" onclick="setBanner('standard')">Standard Odes</button>
            </div>
        </header>

        <div class="dashboard">
            <div class="stat-card">
                <h3>Total Pulls</h3>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h3>Current Pity</h3>
                <div class="stat-value" id="stat-pity">0</div>
            </div>
            <div class="stat-card">
                <h3>Avg. Pity</h3>
                <div class="stat-value" id="stat-avg-pity">0</div>
            </div>
            <div class="stat-card">
                <h3 id="percent-label">5 Star %</h3>
                <div class="stat-value" id="stat-percent">0%</div>
            </div>
        </div>

        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="margin-bottom: 0;">Pull History</h2>
                <div class="filter-toggle" id="filter-buttons" style="display: flex; gap: 0.5rem;">
                    <!-- Populated by JS -->
                </div>
            </div>
            <table id="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Stars</th>
                            <th>Date</th>
                            <th>Pity Hit</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
                <div class="pagination">
                    <div>
                        <button onclick="changePage(-1)" id="btn-prev">Previous</button>
                        <span id="page-info" style="margin: 0 1rem;">Page 1</span>
                        <button onclick="changePage(1)" id="btn-next">Next</button>
                    </div>
                    <div>
                        <select id="items-per-page" onchange="changeItemsPerPage()" style="width: auto; padding: 0.5rem;">
                            <option value="5">5 per page</option>
                            <option value="10" selected>10 per page</option>
                            <option value="20">20 per page</option>
                            <option value="50">50 per page</option>
                        </select>
                    </div>
                </div>
            </div>

        <div class="data-management">
            <input type="file" id="import-file" style="display: none" accept=".json" onchange="importData(event)">
            <button onclick="openModal()" style="border-color: var(--accent-blue); color: var(--accent-blue);">Log Pull Manually</button>
            <button onclick="document.getElementById('import-file').click()">Import JSON</button>
            <button onclick="exportData()">Export JSON</button>
            <button onclick="clearData()" style="border-color: #ef4444; color: #ef4444;">Clear Data</button>
        </div>
    </div>

    <!-- Modal for Logging Pulls -->
    <div class="modal-overlay" id="pull-modal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2>Log a Pull</h2>
            <form id="pull-form">
                <div class="form-group" style="margin-top: 1rem;">
                    <label for="item-name">Item / Character Name</label>
                    <input type="text" id="item-name" required placeholder="e.g., Astral Weaver">
                </div>
                <div class="form-group">
                    <label for="item-rarity">Rarity</label>
                    <select id="item-rarity" required>
                        <!-- Populated by JS based on banner type -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="item-date">Date</label>
                    <input type="date" id="item-date" required>
                </div>
                <button type="submit" class="btn-submit">Add Pull</button>
            </form>
        </div>
    </div>

    <script>
        let state = { event: [], standard: [] };
        let activeBanner = 'event';
        let activeFilter = 'all';
        let currentPage = 1;
        let itemsPerPage = 10;

        // Pity Thresholds
        const PITY_SOFT = 55;
        const PITY_HARD = 70;

        function init() {
            const savedData = localStorage.getItem('miliastra_wishes_v2');
            if (savedData) state = JSON.parse(savedData);
            document.getElementById('item-date').valueAsDate = new Date();
            document.getElementById('percent-label').innerText = '5 Star %'; // default for event
            updateFormDropdown();
            updateFilterButtons();
            updateUI();
        }



        function getRarityClass(stars, banner) {
            if (stars == '5') return 'rarity-legendary';
            if (stars == '4') return 'rarity-elite';
            if (stars == '3') return 'rarity-rare';
            if (stars == '2') return 'rarity-white';
            return 'rarity-white';
        }

        function calculateStats() {
            const history = state[activeBanner];
            const total = history.length;

            let currentPity = 0;
            let legendaryCount = 0;
            let totalPityCost = 0;

            let pities = { '5': 0, '4': 0, '3': 0 };

            const reversed = [...history].reverse();
            reversed.forEach(pull => {
                pities['5']++; pities['4']++; pities['3']++;

                if (activeBanner === 'event') {
                    if (pull.rarity == '5') {
                        pull.pityHit = pities['5'];
                        pities['5'] = 0;
                        legendaryCount++;
                        totalPityCost += pull.pityHit;
                    } else if (pull.rarity == '4') {
                        pull.pityHit = pities['4'];
                        pities['4'] = 0;
                    } else {
                        pull.pityHit = '-';
                    }
                } else {
                    if (pull.rarity == '4') {
                        pull.pityHit = pities['4'];
                        pities['4'] = 0;
                        legendaryCount++;
                        totalPityCost += pull.pityHit;
                    } else if (pull.rarity == '3') {
                        pull.pityHit = pities['3'];
                        pities['3'] = 0;
                    } else {
                        pull.pityHit = '-';
                    }
                }
            });

            currentPity = activeBanner === 'event' ? pities['5'] : pities['4'];
            const avgPity = legendaryCount > 0 ? (totalPityCost / legendaryCount).toFixed(1) : 0;
            const percent = total > 0 ? ((legendaryCount / total) * 100).toFixed(1) : 0;

            return { total, currentPity, avgPity, percent };
        }

        function updateFormDropdown() {
            const select = document.getElementById('item-rarity');
            if (activeBanner === 'standard') {
                select.innerHTML = `
                    <option value="4">4★ (Legendary Equivalent)</option>
                    <option value="3">3★ (Elite Equivalent)</option>
                    <option value="2" selected>2★ (Rare)</option>
                `;
            } else {
                select.innerHTML = `
                    <option value="5">5★ (Legendary)</option>
                    <option value="4">4★ (Elite)</option>
                    <option value="3" selected>3★ (Rare)</option>
                `;
            }
        }

        function setBanner(banner) {
            activeBanner = banner;
            document.getElementById('btn-event').classList.toggle('active', banner === 'event');
            document.getElementById('btn-standard').classList.toggle('active', banner === 'standard');

            document.getElementById('percent-label').innerText = banner === 'event' ? '5 Star %' : '4 Star %';

            activeFilter = 'all';
            currentPage = 1;
            updateFormDropdown();
            updateFilterButtons();
            updateUI();
        }

        function updateFilterButtons() {
            const container = document.getElementById('filter-buttons');
            let html = `<button class="${activeFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All</button>`;
            
            if (activeBanner === 'standard') {
                html += `
                    <button class="${activeFilter === '4' ? 'active' : ''}" onclick="setFilter('4')">4★</button>
                    <button class="${activeFilter === '3' ? 'active' : ''}" onclick="setFilter('3')">3★</button>
                    <button class="${activeFilter === '2' ? 'active' : ''}" onclick="setFilter('2')">2★</button>
                `;
            } else {
                html += `
                    <button class="${activeFilter === '5' ? 'active' : ''}" onclick="setFilter('5')">5★</button>
                    <button class="${activeFilter === '4' ? 'active' : ''}" onclick="setFilter('4')">4★</button>
                    <button class="${activeFilter === '3' ? 'active' : ''}" onclick="setFilter('3')">3★</button>
                `;
            }
            container.innerHTML = html;
        }

        function setFilter(filter) {
            activeFilter = filter;
            currentPage = 1;
            updateFilterButtons();
            renderTable();
        }

        function openModal() {
            document.getElementById('pull-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('pull-modal').classList.remove('active');
        }

        function addPull(event) {
            event.preventDefault();
            const name = document.getElementById('item-name').value;
            const rarity = document.getElementById('item-rarity').value;
            const date = document.getElementById('item-date').value;

            state[activeBanner].unshift({ id: Date.now().toString(), name, rarity, date, pityHit: '-' });
            
            updateUI();
            saveData();

            document.getElementById('item-name').value = '';
            closeModal();
        }

        function updateUI() {
            const stats = calculateStats();
            document.getElementById('stat-total').innerText = stats.total;

            const pityEl = document.getElementById('stat-pity');
            pityEl.innerText = stats.currentPity;

            pityEl.className = 'stat-value';
            if (stats.currentPity >= PITY_HARD) {
                pityEl.classList.add('hard-pity');
            } else if (stats.currentPity >= PITY_SOFT) {
                pityEl.classList.add('soft-pity');
            }

            document.getElementById('stat-avg-pity').innerText = stats.avgPity;
            document.getElementById('stat-percent').innerText = `${stats.percent}%`;

            renderTable();
        }

        function renderTable() {
            const history = state[activeBanner].map((pull, idx) => ({
                ...pull,
                pullNumber: state[activeBanner].length - idx
            }));
            
            let filteredHistory = history;
            if (activeFilter !== 'all') {
                filteredHistory = filteredHistory.filter(pull => pull.rarity === activeFilter);
            }

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;

            filteredHistory.slice(startIndex, endIndex).forEach((pull, index) => {
                const tr = document.createElement('tr');
                const cssClass = getRarityClass(pull.rarity, activeBanner);

                tr.innerHTML = `
                    <td>${pull.pullNumber}</td>
                    <td class="${cssClass}">${pull.name || 'Unknown Item'}</td>
                    <td class="${cssClass}">${pull.rarity}★</td>
                    <td>${pull.date}</td>
                    <td>${pull.pityHit}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('page-info').innerText = `Page ${currentPage} of ${Math.ceil(filteredHistory.length / itemsPerPage) || 1}`;
            document.getElementById('btn-prev').disabled = currentPage === 1;
            document.getElementById('btn-next').disabled = endIndex >= filteredHistory.length;
        }

        function changePage(dir) { currentPage += dir; renderTable(); }
        
        function changeItemsPerPage() {
            itemsPerPage = parseInt(document.getElementById('items-per-page').value);
            currentPage = 1;
            renderTable();
        }
        function saveData() { localStorage.setItem('miliastra_wishes_v2', JSON.stringify(state)); }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "miliastra_wishes.json";
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.event && importedData.standard) {
                        state = importedData;
                        updateUI();
                        saveData();
                        alert("Data imported successfully!");
                    } else alert("Invalid file format.");
                } catch (err) { alert("Error parsing JSON."); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function clearData() {
            if (confirm("Delete all data?")) { state = { event: [], standard: [] }; saveData(); updateUI(); }
        }

        document.getElementById('pull-form').addEventListener('submit', addPull);
        document.getElementById('pull-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        init();
    </script>
</body>

</html>
