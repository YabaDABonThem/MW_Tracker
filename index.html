<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miliastra Wonderland | Wish Tracker</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #161b2b;
            --panel-border: #2a314d;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24;
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;

            --legendary-color: #fbbf24;
            --elite-color: #c084fc;
            --rare-color: #60a5fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 1rem;
        }

        h1 {
            color: var(--accent-gold);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .banner-toggle {
            display: flex;
            gap: 1rem;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            border-color: var(--accent-purple);
        }

        button.active {
            background-color: var(--accent-purple);
            border-color: var(--accent-purple);
            color: white;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .currency-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 0.5rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 0.5rem 0;
        }

        .soft-pity {
            color: #f97316;
        }

        .hard-pity {
            color: #ef4444;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .panel h2 {
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-color);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 6px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--panel-border);
        }

        th {
            color: var(--text-muted);
        }

        .rarity-legendary {
            color: var(--legendary-color);
            font-weight: bold;
        }

        .rarity-elite {
            color: var(--elite-color);
            font-weight: bold;
        }

        .rarity-rare {
            color: var(--rare-color);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .data-management {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>Miliastra Wonderland</h1>
                <p class="currency-label" id="currency-display">Current Currency: Arcane Keystones</p>
            </div>
            <div class="banner-toggle">
                <button class="active" id="btn-event" onclick="setBanner('event')">Event Odes</button>
                <button id="btn-standard" onclick="setBanner('standard')">Standard Odes</button>
            </div>
        </header>

        <div class="dashboard">
            <div class="stat-card">
                <h3>Total Pulls</h3>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h3>Current Pity</h3>
                <div class="stat-value" id="stat-pity">0</div>
                <div id="pity-status" class="currency-label">Safe Zone</div>
            </div>
            <div class="stat-card">
                <h3>Avg. Pity</h3>
                <div class="stat-value" id="stat-avg-pity">0</div>
            </div>
            <div class="stat-card">
                <h3>Legendary %</h3>
                <div class="stat-value" id="stat-percent">0%</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <h2>Log a Pull</h2>
                <form id="pull-form">
                    <div class="form-group">
                        <label for="item-name">Item / Character Name</label>
                        <input type="text" id="item-name" required placeholder="e.g., Astral Weaver">
                    </div>
                    <div class="form-group">
                        <label for="item-rarity">Rarity</label>
                        <select id="item-rarity" required>
                            <!-- Populated by JS based on banner type -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="item-date">Date</label>
                        <input type="date" id="item-date" required>
                    </div>
                    <button type="submit" class="btn-submit">Add Pull</button>
                </form>
            </div>

            <div class="panel">
                <h2>Pull History</h2>
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Stars</th>
                            <th>Date</th>
                            <th>Pity Hit</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
                <div class="pagination">
                    <button onclick="changePage(-1)" id="btn-prev">Previous</button>
                    <span id="page-info">Page 1</span>
                    <button onclick="changePage(1)" id="btn-next">Next</button>
                </div>
            </div>
        </div>

        <div class="data-management">
            <input type="file" id="import-file" style="display: none" accept=".json" onchange="importData(event)">
            <button onclick="document.getElementById('import-file').click()">Import JSON</button>
            <button onclick="exportData()">Export JSON</button>
            <button onclick="clearData()" style="border-color: #ef4444; color: #ef4444;">Clear Data</button>
        </div>
    </div>

    <script>
        let state = { event: [], standard: [] };
        let activeBanner = 'event';
        let currentPage = 1;
        const ITEMS_PER_PAGE = 10;

        // Pity Thresholds
        const PITY_SOFT = 55;
        const PITY_HARD = 70;

        function init() {
            const savedData = localStorage.getItem('miliastra_wishes_v2');
            if (savedData) state = JSON.parse(savedData);
            document.getElementById('item-date').valueAsDate = new Date();
            updateFormDropdown();
            updateUI();
        }

        function isLegendaryPull(stars, banner) {
            if (banner === 'standard') return stars == '4';
            return stars == '5';
        }

        function getRarityClass(stars, banner) {
            if (banner === 'standard') {
                if (stars == '4') return 'rarity-legendary';
                if (stars == '3') return 'rarity-elite';
                return 'rarity-rare';
            } else {
                if (stars == '5') return 'rarity-legendary';
                if (stars == '4') return 'rarity-elite';
                return 'rarity-rare';
            }
        }

        function calculateStats() {
            const history = state[activeBanner];
            const total = history.length;

            let currentPity = 0;
            let legendaryCount = 0;
            let totalPityCost = 0;

            [...history].reverse().forEach(pull => {
                currentPity++;
                if (isLegendaryPull(pull.rarity, activeBanner)) {
                    legendaryCount++;
                    totalPityCost += currentPity;
                    currentPity = 0;
                }
            });

            const avgPity = legendaryCount > 0 ? (totalPityCost / legendaryCount).toFixed(1) : 0;
            const percent = total > 0 ? ((legendaryCount / total) * 100).toFixed(1) : 0;

            return { total, currentPity, avgPity, percent };
        }

        function updateFormDropdown() {
            const select = document.getElementById('item-rarity');
            if (activeBanner === 'standard') {
                select.innerHTML = `
                    <option value="4">4★ (Legendary Equivalent)</option>
                    <option value="3">3★ (Elite Equivalent)</option>
                    <option value="2" selected>2★ (Rare)</option>
                `;
            } else {
                select.innerHTML = `
                    <option value="5">5★ (Legendary)</option>
                    <option value="4">4★ (Elite)</option>
                    <option value="3" selected>3★ (Rare)</option>
                `;
            }
        }

        function setBanner(banner) {
            activeBanner = banner;
            document.getElementById('btn-event').classList.toggle('active', banner === 'event');
            document.getElementById('btn-standard').classList.toggle('active', banner === 'standard');

            document.getElementById('currency-display').innerText =
                banner === 'event' ? 'Current Currency: Arcane Keystones' : 'Current Currency: Geodes of Replication';

            currentPage = 1;
            updateFormDropdown();
            updateUI();
        }

        function addPull(event) {
            event.preventDefault();
            const name = document.getElementById('item-name').value;
            const rarity = document.getElementById('item-rarity').value;
            const date = document.getElementById('item-date').value;

            const stats = calculateStats();
            const pityHit = isLegendaryPull(rarity, activeBanner) ? stats.currentPity + 1 : '-';

            state[activeBanner].unshift({ id: Date.now().toString(), name, rarity, date, pityHit });
            saveData();

            document.getElementById('item-name').value = '';
            updateUI();
        }

        function updateUI() {
            const stats = calculateStats();
            document.getElementById('stat-total').innerText = stats.total;

            const pityEl = document.getElementById('stat-pity');
            const statusEl = document.getElementById('pity-status');
            pityEl.innerText = stats.currentPity;

            pityEl.className = 'stat-value';
            if (stats.currentPity >= PITY_HARD) {
                pityEl.classList.add('hard-pity');
                statusEl.innerText = "Hard Pity Territory!";
                statusEl.style.color = '#ef4444';
            } else if (stats.currentPity >= PITY_SOFT) {
                pityEl.classList.add('soft-pity');
                statusEl.innerText = "Soft Pity Range";
                statusEl.style.color = '#f97316';
            } else {
                statusEl.innerText = "Safe Zone";
                statusEl.style.color = 'var(--text-muted)';
            }

            document.getElementById('stat-avg-pity').innerText = stats.avgPity;
            document.getElementById('stat-percent').innerText = `${stats.percent}%`;

            renderTable();
        }

        function renderTable() {
            const history = state[activeBanner];
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;

            history.slice(startIndex, endIndex).forEach((pull, index) => {
                const tr = document.createElement('tr');
                const cssClass = getRarityClass(pull.rarity, activeBanner);

                tr.innerHTML = `
                    <td>${history.length - (startIndex + index)}</td>
                    <td class="${cssClass}">${pull.name || 'Unknown Item'}</td>
                    <td class="${cssClass}">${pull.rarity}★</td>
                    <td>${pull.date}</td>
                    <td>${pull.pityHit}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('page-info').innerText = `Page ${currentPage} of ${Math.ceil(history.length / ITEMS_PER_PAGE) || 1}`;
            document.getElementById('btn-prev').disabled = currentPage === 1;
            document.getElementById('btn-next').disabled = endIndex >= history.length;
        }

        function changePage(dir) { currentPage += dir; renderTable(); }
        function saveData() { localStorage.setItem('miliastra_wishes_v2', JSON.stringify(state)); }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "miliastra_wishes.json";
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.event && importedData.standard) {
                        state = importedData;
                        saveData();
                        updateUI();
                        alert("Data imported successfully!");
                    } else alert("Invalid file format.");
                } catch (err) { alert("Error parsing JSON."); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function clearData() {
            if (confirm("Delete all data?")) { state = { event: [], standard: [] }; saveData(); updateUI(); }
        }

        document.getElementById('pull-form').addEventListener('submit', addPull);
        init();
    </script>
</body>

</html>
